name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
            p/typescript
            p/javascript
          generateSarif: false

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (report only)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  pgTAP:
    name: PgTAP Security Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        run: npm install -g @supabase/cli

      - name: Setup Supabase test DB
        run: |
          supabase db start --workdir . || true
          sleep 5

      - name: Run PgTAP security tests
        run: npm run test:regressions 2>&1 | tee pgTAP-output.log
        continue-on-error: true

      - name: Check pgTAP results
        run: |
          if grep -q "Result: PASS" pgTAP-output.log; then
            echo "✅ All pgTAP security tests passed"
            exit 0
          else
            echo "❌ pgTAP tests failed or incomplete"
            cat pgTAP-output.log
            exit 1
          fi

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets (new commits)
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets scan --baseline .secrets.baseline
          else
            echo "⚠️  No baseline found; running scan anyway"
            detect-secrets scan --all-files .
          fi
        continue-on-error: true

      - name: Check git history for secrets (TruffleHog)
        # Pinned to stable v3.15.0 (update via https://github.com/trufflesecurity/trufflehog/releases)
        uses: trufflesecurity/trufflehog@v3.15.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          debug: false
          only-verified: true
